name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.10.0
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Check Astro and TypeScript
        run: pnpm check

      - name: Check formatting and linting
        run: pnpm lint

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Build static site and Pagefind index
        run: pnpm build

      - name: Validate Workers deployment config
        run: pnpm exec wrangler deploy --dry-run
