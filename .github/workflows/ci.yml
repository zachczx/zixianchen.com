name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.10.0
          runtime: node@26

      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Check Astro, TypeScript, formatting and linting
        run: |
          status=0
          pnpm exec astro check &
          astro_pid=$!
          pnpm lint &
          lint_pid=$!
          wait "$astro_pid" || status=$?
          wait "$lint_pid" || status=$?
          exit "$status"

      - name: Validate migrations and build static site
        run: |
          status=0
          pnpm db:migrate:local &
          migration_pid=$!
          pnpm build &
          build_pid=$!
          wait "$migration_pid" || status=$?
          wait "$build_pid" || status=$?
          exit "$status"

      - name: Validate Workers deployment config
        run: pnpm exec wrangler deploy --dry-run
