name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check web
        run: pnpm check:web

      - name: Check notifier Worker
        run: pnpm check:notifier

      - name: Test notifier Worker
        run: pnpm test:notifier

      - name: Check formatting and linting
        run: pnpm lint

      - name: Build web
        run: pnpm --filter @zixianchen/web exec vite build

      - name: Build search index
        run: pnpm --filter @zixianchen/web exec pagefind --site build
