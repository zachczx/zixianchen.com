name: Astro migration validation

on:
  push:
    branches:
      - feat/astro-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile refresh
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh Astro migration lockfile"
          git push

      - name: Check Astro and TypeScript
        run: pnpm check

      - name: Check formatting and linting
        run: pnpm lint

      - name: Build static site and Pagefind index
        run: pnpm build

      - name: Validate Workers static assets config
        run: pnpm exec wrangler deploy --dry-run
