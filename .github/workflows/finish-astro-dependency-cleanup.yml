name: Finish Astro dependency cleanup

on:
  push:
    branches:
      - feat/astro-migration

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/astro-migration
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          cache: false
      - name: Remove migration dependency residue
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app.css')
          text = path.read_text()
          text = text.replace("@import 'tw-animate-css';\n", '')
          path.write_text(text)
          PY
          rm -f src/lib/utils.ts
          rm -f components.json
          rm -f .github/workflows/refresh-astro-lockfile.yml
          rm -f .github/workflows/finish-astro-dependency-cleanup.yml
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Commit cleanup if changed
        shell: bash
        run: |
          git add -A src/app.css src/lib/utils.ts components.json pnpm-lock.yaml .github/workflows/refresh-astro-lockfile.yml .github/workflows/finish-astro-dependency-cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove migration dependency residue"
          git push
