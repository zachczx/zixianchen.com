name: Normalize Anime.js lockfile

on:
  push:
    branches:
      - feat/anime-nav-tone-morph

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/anime-nav-tone-morph
          fetch-depth: 0

      - name: Reset lockfile to main and add Anime.js only
        run: |
          git show origin/main:pnpm-lock.yaml > pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          text = path.read_text()

          text = text.replace(
              "      dayjs:\n        specifier: ^1.11.23\n        version: 1.11.23\n",
              "      animejs:\n        specifier: ^4.5.0\n        version: 4.5.0\n      dayjs:\n        specifier: ^1.11.23\n        version: 1.11.23\n",
              1,
          )

          text = text.replace(
              "  am-i-vibing@0.4.0:\n    resolution: {integrity: sha512-MxT4XZL7pzLHpuvhDKdMaQHMGGkJDLluKBLsbstn+8wv9sWcFT6h+0ve9qkml95amVTZtZV83gQe2hY+ojgHLg==}\n    hasBin: true\n",
              "  animejs@4.5.0:\n    resolution: {integrity: sha512-NQimYX+lz8WaXonGS9zVVoviCIAjONeJayxacUditaivYLqyXgGjFKjuyl0aUUhFKm5MriX9ty1TGovNzoJQWA==}\n    peerDependencies:\n      '@types/three': '>=0.150.0'\n      three: '>=0.150.0'\n    peerDependenciesMeta:\n      '@types/three':\n        optional: true\n      three:\n        optional: true\n\n  am-i-vibing@0.4.0:\n    resolution: {integrity: sha512-MxT4XZL7pzLHpuvhDKdMaQHMGGkJDLluKBLsbstn+8wv9sWcFT6h+0ve9qkml95amVTZtZV83gQe2hY+ojgHLg==}\n    hasBin: true\n",
              1,
          )

          marker = "snapshots:\n"
          before, after = text.split(marker, 1)
          after = after.replace(
              "  am-i-vibing@0.4.0:\n    dependencies:\n      process-ancestry: 0.1.0\n",
              "  animejs@4.5.0: {}\n\n  am-i-vibing@0.4.0:\n    dependencies:\n      process-ancestry: 0.1.0\n",
              1,
          )
          path.write_text(before + marker + after)
          PY

      - name: Commit minimal lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: keep animejs lockfile diff minimal"
          git push origin HEAD:feat/anime-nav-tone-morph
