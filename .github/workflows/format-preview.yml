name: Format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Print formatted ArticleToc
        run: pnpm exec prettier src/components/ArticleToc.astro
