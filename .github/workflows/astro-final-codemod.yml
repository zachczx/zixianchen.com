name: Final Astro migration codemod

on:
  push:
    branches:
      - feat/astro-migration

permissions:
  contents: write

concurrency:
  group: astro-final-codemod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Remove final SvelteKit compatibility shims
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          blog = Path('src/routes/blog/+page.svelte')
          text = blog.read_text()
          text = text.replace("\timport { replaceState } from '$app/navigation';\n", '')
          text = text.replace("\treplaceState(url, {});", "\thistory.replaceState({}, '', url);")
          blog.write_text(text)

          config = Path('astro.config.mjs')
          text = config.read_text()
          text = text.replace("import { fileURLToPath } from 'node:url';\n", '')
          text = text.replace("const navigationShim = fileURLToPath(new URL('./src/lib/sveltekit-navigation-shim.ts', import.meta.url));\n\n", '')
          text = text.replace("\t\tresolve: {\n\t\t\talias: {\n\t\t\t\t'$app/navigation': navigationShim,\n\t\t\t},\n\t\t},\n", '')
          config.write_text(text)

          plan = Path('docs/astro-migration-plan.md')
          plan.write_text(plan.read_text().replace('Astro 6', 'Astro 7'))

          shim = Path('src/lib/sveltekit-navigation-shim.ts')
          if shim.exists():
              shim.unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro.config.mjs docs/astro-migration-plan.md src/routes/blog/+page.svelte src/lib/sveltekit-navigation-shim.ts
          git commit -m "refactor: remove final SvelteKit compatibility shim"
          git push
