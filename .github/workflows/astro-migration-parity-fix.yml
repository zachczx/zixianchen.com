name: Astro migration parity fixer

on:
  push:
    branches:
      - feat/astro-migration

permissions:
  contents: write

concurrency:
  group: astro-migration-parity-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/astro-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply mechanical parity fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(file, from, to) {
            let source = fs.readFileSync(file, 'utf8');
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`Expected text not found in ${file}: ${from}`);
            source = source.replace(from, to);
            fs.writeFileSync(file, source);
          }

          replaceRequired(
            'src/components/Nav.astro',
            `<div data-site-nav data-path-name={pathName} data-track-sections={trackSections ? 'true' : 'false'}>`,
            `<div class="contents" data-site-nav data-path-name={pathName} data-track-sections={trackSections ? 'true' : 'false'}>`,
          );

          replaceRequired(
            'src/components/Icon.astro',
            `\tviewBox="0 0 24 24"\n\tfill="none"`,
            `\tviewBox="0 0 24 24"\n\twidth="1em"\n\theight="1em"\n\tfill="none"`,
          );

          replaceRequired(
            'src/components/BlogIndex.astro',
            `\t\t\t\t\t\t</span>\n\t\t\t\t\t\t{post.title}`,
            `\t\t\t\t\t\t</span>{' '}\n\t\t\t\t\t\t{post.title}`,
          );
          replaceRequired(
            'src/components/BlogIndex.astro',
            'if (number) number.textContent = `${visible}.`;',
            'if (number) number.textContent = `${visible}. `;',
          );
          replaceRequired(
            'src/components/BlogIndex.astro',
            `</span>\${escapeHtml(result.meta.title ?? '')}`,
            `</span> \${escapeHtml(result.meta.title ?? '')}`,
          );

          let audit = fs.readFileSync('.github/workflows/astro-pr-audit.yml', 'utf8');
          audit = audit.replace(
            "ROUTES='/,/blog,/blog/so-you-want-bigger-job,/contact,/projects/apptitude,/projects/lingo'",
            "ROUTES='/,/blog,/blog/so-you-want-bigger-job,/contact,/projects/apptitude,/projects/lingo,/projects/cubby,/projects/btonomics'",
          );
          audit = audit.replace(
            "          echo '## SvelteKit baseline'\n          node current/scripts/audit-js.mjs --label SvelteKit --root baseline/build --routes \"$ROUTES\"\n          echo\n          echo '## Astro migration'\n          node current/scripts/audit-js.mjs --label Astro --root current/dist --routes \"$ROUTES\"",
            "          mkdir -p js-audit\n          echo '## SvelteKit baseline'\n          node current/scripts/audit-js.mjs --label SvelteKit --root baseline/build --routes \"$ROUTES\" | tee js-audit/sveltekit.txt\n          echo\n          echo '## Astro migration'\n          node current/scripts/audit-js.mjs --label Astro --root current/dist --routes \"$ROUTES\" | tee js-audit/astro.txt",
          );
          if (!audit.includes('name: astro-migration-js-audit')) {
            audit = audit.replace(
              '\n  visual:\n',
              `\n      - name: Upload JavaScript audit\n        uses: actions/upload-artifact@v4\n        with:\n          name: astro-migration-js-audit\n          path: js-audit\n          if-no-files-found: error\n\n  visual:\n`,
            );
          }
          if (!audit.includes('[cubby]="/projects/cubby"')) {
            audit = audit.replace(
              '            [lingo]="/projects/lingo"\n',
              '            [lingo]="/projects/lingo"\n            [cubby]="/projects/cubby"\n            [btonomics]="/projects/btonomics"\n',
            );
            audit = audit.replace(
              '            for name in home blog article contact apptitude lingo; do',
              '            for name in home blog article contact apptitude lingo cubby btonomics; do',
            );
          }
          if (!audit.includes("Path('screenshots/diff')")) {
            audit = audit.replace(
              "              diff = ImageChops.difference(a, b)\n              mean = sum(ImageStat.Stat(diff).mean) / 3 / 255 * 100",
              "              diff = ImageChops.difference(a, b)\n              diff_dir = Path('screenshots/diff')\n              diff_dir.mkdir(parents=True, exist_ok=True)\n              diff.save(diff_dir / baseline.name)\n              mean = sum(ImageStat.Stat(diff).mean) / 3 / 255 * 100",
            );
          }
          fs.writeFileSync('.github/workflows/astro-pr-audit.yml', audit);
          NODE

      - name: Format changed files
        run: pnpm exec prettier --write src/components/Nav.astro src/components/Icon.astro src/components/BlogIndex.astro .github/workflows/astro-pr-audit.yml

      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Nav.astro src/components/Icon.astro src/components/BlogIndex.astro .github/workflows/astro-pr-audit.yml
          git commit -m "fix: restore migration visual parity"
          git push origin HEAD:feat/astro-migration
