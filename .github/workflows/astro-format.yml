name: Format Astro migration pages

on:
  push:
    branches:
      - feat/astro-migration

permissions:
  contents: write

concurrency:
  group: astro-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Astro pages
        run: pnpm exec prettier --write src/pages/index.astro src/pages/contact.astro

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/pages/index.astro src/pages/contact.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/pages/contact.astro
          git commit -m "style: format native Astro pages"
          git push
