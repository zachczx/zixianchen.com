<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#ecf0f2" />
		<link rel="icon" href="/favicon-32x32.png" />
		<title>404 | Zixian Chen</title>
		<style>
			:root {
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				color: #0e0e0e;
				background: #ecf0f2;
			}

			body {
				display: grid;
				min-height: 100vh;
				min-height: 100dvh;
				margin: 0;
				place-items: center;
			}

			main {
				display: grid;
				justify-items: center;
				gap: 1rem;
				padding: 2rem;
				text-align: center;
			}

			h1 {
				margin: 0;
				font-size: clamp(6rem, 20vw, 10rem);
				line-height: 0.85;
				letter-spacing: -0.04em;
			}

			p {
				margin: 0;
				color: #555b61;
				font-size: 1.25rem;
			}

			a {
				margin-top: 1.5rem;
				padding: 0.75rem 1.5rem;
				border-radius: 999px;
				color: #fff;
				background: #0e0e0e;
				font-weight: 600;
				text-decoration: none;
			}

			a:focus-visible {
				outline: 3px solid #f93827;
				outline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>404</h1>
			<p>This page could not be found.</p>
			<a href="/">Go home</a>
		</main>
	</body>
</html>
